      const lt = this.tl[+Ls];
      links[Ls].forEach((lk, j) => {
        const el = this.ulEls[k++]; if (!el) return;
        const u = lt.uls[j], p = sstep(0, 1, clamp((T - u.start) / u.dur));
        el.style.transform = `scaleX(${p.toFixed(4)}) rotate(-0.6deg)`;
        const idx = k - 1, tap = this.tapEls[idx];
        if (!tap || this.reduced) return;
        if (p >= 1 && this.tapStart[idx] == null) this.tapStart[idx] = now;
        const st = this.tapStart[idx];
        const q = st == null ? -1 : (now - st) / 1700;
        if (q < 0 || q > 1) { if (tap.style.opacity !== '0') tap.style.opacity = '0'; return; }
        const inP = sstep(0, 0.25, q), press = sstep(0.25, 0.36, q) * (1 - sstep(0.4, 0.52, q)), out = sstep(0.6, 0.85, q);
        const dx = 16 * (1 - inP) + 8 * out, dy = 20 * (1 - inP) + 8 * (1 - press) * inP + 12 * out;
        tap.style.opacity = (inP * (1 - out)).toFixed(3);
        const svg = tap.lastElementChild, ring = tap.firstElementChild;
        tap.style.transform = `translate(${dx.toFixed(2)}px,${dy.toFixed(2)}px)`;
        if (svg) svg.style.transform = `scale(${(1 - 0.08 * press).toFixed(4)})`;
        if (ring) { const r = clamp((q - 0.34) / 0.36); ring.style.opacity = (r > 0 && r < 1 ? 0.9 * (1 - r) : 0).toFixed(3); ring.style.transform = `translate(${(-dx).toFixed(2)}px,${(-dy).toFixed(2)}px) scale(${(0.3 + 1.2 * r).toFixed(3)})`; }
      });
    });
    if (this.page) this.page.querySelectorAll('a[data-line]').forEach(a => {
      const on = T >= this.tl[+a.getAttribute('data-line')].ready;
      a.style.pointerEvents = on ? 'auto' : 'none';
    });
  }

  onLinkFocus = ev => {
    const L = +ev.currentTarget.getAttribute('data-line');
    const lt = this.tl && this.tl[L]; if (!lt) return;
    if (this.T < lt.done) {
      this.T = Math.max(this.T, lt.done);
      window.scrollTo({ top: this.introH + lt.done * this.perSec + 2 });
    }
  };

  renderVals() {
    const links = this.links();
    const lines = BOX.map(([x, y, w, h], L) => {
      const words = TEXT[L].split(' '), segs = []; let i = 0, prevB = 0;
      while (i < words.length) {
        const lk = (links[L] || []).find(q => q.from === i);
        const j = lk ? lk.to : i;
        const a = WORDS[L][i][0], b = WORDS[L][j][1];
        segs.push({ text: words.slice(i, j + 1).join(' ') + (j < words.length - 1 ? ' ' : ''), ml: +((a - prevB) * K).toFixed(2), w: +((b - a) * K).toFixed(2), href: lk ? lk.href : null, plain: !lk, line: L });
        prevB = b; i = j + 1;
      }
      return { l: +(x * K).toFixed(2), t: +(y * K).toFixed(2), w: +(w * K).toFixed(2), h: +(h * K).toFixed(2), fs: +(h * K * 0.42).toFixed(2), src: `assets/ink/line-${String(L + 1).padStart(2, '0')}.png`, segs, ref: el => {
        this.lineEls[L] = el;
        const im = el && el.querySelector('img');
        if (im && !im.getAttribute('src')) im.src = `assets/ink/line-${String(L + 1).padStart(2, '0')}.png`;
      } };
    });
    const underlines = []; let k = 0;
    Object.keys(links).forEach(Ls => links[Ls].forEach(lk => {
      const idx = k++; const [x, y] = BOX[+Ls];
      const ul = (x + lk.ul[0]) * K, ut = (y + lk.uy) * K, uw = (lk.ul[1] - lk.ul[0]) * K;
      const fx = ul + uw * 0.5, fy = ut - 14, tipX = 40 * 8 / 24, tipY = 40 * 2 / 24;
      underlines.push({ l: +ul.toFixed(2), t: +ut.toFixed(2), w: +uw.toFixed(2), hl: +(fx - tipX).toFixed(2), ht: +(fy - tipY).toFixed(2), rx: +tipX.toFixed(2), ry: +tipY.toFixed(2), ref: el => { this.ulEls[idx] = el; }, tapRef: el => { this.tapEls[idx] = el; } });
    }));
    return {
      lines, underlines, onLinkFocus: this.onLinkFocus,
      stageRef: this.stageRef, deskRef: this.deskRef, camRef: this.camRef, tiltRef: this.tiltRef,
      pageRef: this.pageRef, coverRef: this.coverRef, hintRef: this.hintRef, gestureRef: this.gestureRef, arrowRef: this.arrowRef, spacerRef: this.spacerRef,
    };
  }
}
</script>
</body>
